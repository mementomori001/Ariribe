<!DOCTYPE html>
<html lang="ja" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ありリベ攻略・備忘録 | ありふれた職業で世界最強 リベリオンソウル</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&family=Noto+Sans+JP:wght@400;500;600;700;800&family=Shippori+Mincho:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./assets/style.css">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <div class="site-brand" id="brand-home" role="button" tabindex="0">
        <span class="brand-dot"></span>
        <span class="brand-name">ありリベ攻略・備忘録</span>
      </div>

      <nav class="nav-links" aria-label="メインナビゲーション">
        <button class="nav-link active" data-nav="home">トップ</button>
        <button class="nav-link" data-nav="articles">攻略記事</button>
        <button class="nav-link" data-mega-toggle="db" type="button">データベース <span class="nav-caret">▾</span></button>
        <button class="nav-link" data-mega-toggle="tools" type="button">便利機能 <span class="nav-caret">▾</span></button>
      </nav>

      <div class="header-tools">
        <button class="search-pill" id="search-trigger" type="button">
          <span>🔍 検索</span>
          <span class="kbd" style="font-size:11px;">Ctrl+K</span>
        </button>
        <button class="theme-btn" id="theme-toggle" type="button">🌙 暗転</button>
      </div>
    </div>
  </header>

  <!-- PlayStation.com-style Mega-Menu Drawer -->
  <div class="mega-drawer" id="mega-drawer" role="region" aria-label="サブメニュー">
    <div class="mega-inner" id="mega-inner"></div>
  </div>

  <main class="page-wrap" id="app-root">
    <div style="padding:40px 0;color:var(--text-muted);">読み込み中…</div>
  </main>

  <footer class="site-footer">
    <span>ありふれた職業で世界最強 リベリオンソウル（ありリベ）非公式攻略・備忘録サイト</span>
    <span>GitHub Pages 無料ホスティング &amp; GitHub Discussions (Giscus) 対応</span>
  </footer>

  <!-- Global Search Modal -->
  <div class="modal-backdrop" id="search-modal" role="dialog" aria-modal="true">
    <div class="cmd-panel">
      <div style="display:flex;align-items:center;padding:12px 16px;border-bottom:1px solid var(--border);gap:10px;">
        <span style="color:var(--text-muted);">🔍</span>
        <input type="search" id="global-search-input" style="border:none;background:transparent;flex:1;font-size:14.5px;outline:none;" placeholder="記事・キャラ・魔法陣・魔獣・AFで検索 (↑↓ / Enter)">
        <button class="btn-soft" data-close-modal type="button" style="padding:4px 9px;">ESC</button>
      </div>
      <div id="global-search-results" style="max-height:56vh;overflow-y:auto;"></div>
    </div>
  </div>

  <script src="./assets/app.js"></script>
</body>
</html>
